[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexnusa-rag"
version = "0.1.0"
description = "RAG regulations assistant for Indonesian law"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "qdrant-client>=1.14,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "respx>=0.22,<1"]
rerank = ["sentence-transformers>=5,<6"]

[project.scripts]
lexnusa-scrape = "lexnusa.scraping.cli:main"
lexnusa-index = "lexnusa.qdrant_store:main"
lexnusa-chroma-index = "lexnusa.indexing:main"
lexnusa-qdrant-index = "lexnusa.qdrant_store:main"
lexnusa-ask = "lexnusa.rag:main"
lexnusa-api = "lexnusa.api:run"
lexnusa-eval = "lexnusa.eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lexnusa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
